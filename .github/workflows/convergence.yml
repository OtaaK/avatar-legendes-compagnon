name: Convergence React — Bibliothèque
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lot1:
    name: Bibliothèque et non-régression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:extraction
      - run: npm run test:inventory
      - run: npm run test:contracts
      - run: npm run test:parity
      - run: npm run build
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:react
      - run: npm run test:characters
      - run: npm run test:library
      - uses: actions/upload-artifact@v4
        with:
          name: avatar-legendes-bibliotheque-portable
          path: |
            dist/companion/index.html
            docs/reference/TESTER_BIBLIOTHEQUE.md
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: convergence-rapports-et-captures
          path: |
            work/parity/results.json
            work/lot1-browser/
            work/lot2-browser/
            work/library-browser/
          retention-days: 30
